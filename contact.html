
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="responsive.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Pandit Sanjeev Rai Ji</title>

    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Contact Section -->
    <section class="contact-section">

        <div class="contact-container">
            <div class="contact-left">
                <div class="contact-image">
                    <img src="IMAGES/image copy 2.png" alt="Pandit Sanjeev Rai Ji">
                    <div class="image-overlay">
                        <span>BOOK A PUJA</span>
                        <h2>Connect with Pandit Ji</h2>
                    </div>
                </div>

                <div class="contact-details">
                    <div class="detail-item">
                        <span class="detail-icon">☎</span>
                        <div>
                            <small>Call Us</small>
                            <a href="tel:+919673140658">☎ +91 96731 40658</a>
                            <a href="tel:+919883725651">☎ +91 98837 25651</a>
                        </div>
                    </div>

                    <div class="detail-item">
                        <span class="detail-icon">⌖</span>
                        <div>
                            <small>Location</small>
                            <span>India</span>
                        </div>
                    </div>
                </div>

                <div class="contact-map">
                    <iframe
                        title="Location map"
                        src="https://maps.google.com/maps?q=India&t=&z=5&ie=UTF8&iwloc=&output=embed"
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>

            <div class="contact-form-card">
                <span class="form-label">CONTACT US</span>
                <h1>Send Your Puja Inquiry</h1>
                <p>Share your requirement and our team will contact you.</p>

                <form id="contactForm">
                    <div class="form-row">
                        <label>
                            Full Name
                            <input type="text" name="name" placeholder="Enter your name" required>
                        </label>

                        <label>
                            Phone Number
                            <input type="tel" name="phone" placeholder="+91 00000 00000" required>
                        </label>
                    </div>

                    <label>
                        Email Address
                        <input type="email" name="email" placeholder="Enter your email address">
                    </label>

                    <label>
                        Puja / Service Type
                        <select name="service" required>
                            <option value="">Select a service</option>
                            <option>Durga Puja</option>
                            <option>Kali Puja</option>
                            <option>Lakshmi Puja</option>
                            <option>Saraswati Puja</option>
                            <option>Ganesh Puja</option>
                            <option>Satyanarayan Puja</option>
                            <option>Havan / Rudrabhishek</option>
                            <option>Griha Pravesh / Vastu Shanti</option>
                            <option>Marriage or Naming Ceremony</option>
                            <option>Other Puja / Ceremony</option>
                        </select>
                    </label>

                    <label>
                        Preferred Date
                        <input type="date" name="date">
                    </label>

                    <label>
                        Message
                        <textarea name="message" placeholder="Tell us about your puja requirement" rows="5" required></textarea>
                    </label>

                    <button type="submit">Submit Inquiry</button>
                </form>
            </div>

        </div>

    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- JavaScript -->
    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script src="contact.js"></script>
    <script src="contact-actions.js"></script>

<div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,bn',
        autoDisplay: false
    }, 'google_translate_element');
}
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


</body>
</html>
